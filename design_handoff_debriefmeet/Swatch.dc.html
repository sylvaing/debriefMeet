<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border: 1px solid #E7E9EE; border-radius: 10px; overflow: hidden; background: #fff;">
  <div style="height: 56px; background: {{ hex }}; {{ inner }}"></div>
  <div style="padding: 9px 11px; display: flex; flex-direction: column; gap: 2px;">
    <span style="font-size: 12.5px; font-weight: 600; color: #1A1D23;">{{ name }}</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #98A2B3;">{{ hex }}</span>
    <span style="font-size: 11px; color: #667085; line-height: 1.35; margin-top: 2px;">{{ use }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 160, &quot;height&quot;: 118}, &quot;c&quot;: {&quot;editor&quot;: null, &quot;tsType&quot;: &quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.c || {};
    return {
      hex: c.hex || '#000', name: c.name || '', use: c.use || '',
      inner: c.bordered ? 'box-shadow: inset 0 0 0 1px #E7E9EE;' : '',
    };
  }
}
</script>
</body>
</html>
