<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ box }}">
  <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4">
    <span style="{{ b }}"></span>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 48, &quot;height&quot;: 48}, &quot;color&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#3B5BDB&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;filled&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;}, &quot;size&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 34, &quot;min&quot;: 16, &quot;max&quot;: 96, &quot;tsType&quot;: &quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const size = Number(this.props.size) || 34;
    const color = this.props.color || '#3D4351';
    const filled = this.props.filled ?? false;
    const radius = (size * 0.27).toFixed(1);
    const bw = Math.max(2, size * 0.088);
    const gap = size * 0.072;
    const border = Math.max(1.5, size * 0.06);

    const box = `width:${size}px;height:${size}px;flex:0 0 ${size}px;border-radius:${radius}px;`
      + `display:flex;align-items:center;justify-content:center;gap:${gap.toFixed(1)}px;`
      + (filled
          ? `background:${color};box-shadow:0 4px 10px -4px ${color}80;`
          : `background:transparent;box-shadow:inset 0 0 0 ${border.toFixed(1)}px ${color};`);

    const barColor = filled ? '#ffffff' : color;
    const ratios = [0.29, 0.50, 0.235, 0.41];
    const bars = ratios.map(r => `width:${bw.toFixed(1)}px;height:${(size * r).toFixed(1)}px;border-radius:${(bw / 2).toFixed(1)}px;background:${barColor};`);

    return { box, bars };
  }
}
</script>
</body>
</html>
