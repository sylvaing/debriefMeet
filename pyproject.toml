[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debrief-meet"
version = "0.3.0"
description = "Transcription vocale locale — dictée, réunion, journal"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "scipy>=1.10",
    "httpx>=0.27",       # interco BlueMind (core/bluemind/client.py) — wheels purs, PyInstaller-friendly
    "python-dateutil>=2.8",  # expansion des séries récurrentes BlueMind (core/bluemind/recurrence.py) — pur Python
    # Windows n'a AUCUNE base de fuseaux système : `zoneinfo` y est inerte sans ce
    # paquet. `core/bluemind/sync.py` et `recurrence.py` enveloppent `ZoneInfo(...)`
    # dans un try/except, donc l'absence ne plante pas — elle fait retomber
    # silencieusement sur un offset figé, c'est-à-dire précisément le bug DST que
    # docs/40 §5.2 corrigeait. Sur macOS/Linux la base système suffit.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
macos = [
    "mlx-whisper",
    "livekit>=1.1",      # AEC3 (annulation d'écho sans casque) — APM WebRTC, cf. docs/06
    # ≥4.0.7 : la 4.0.6 (retirée de PyPI depuis) rend un générateur au lieu du résultat
    # quand on appelle le pipeline — diarization morte dans le build du 2026-08-21.
    "pyannote.audio>=4.0.7,<5", # diarization passe finale (community-1, gated) — cf. docs/07 et docs/29 (API from_pretrained changée entre 3.x et 4.x)
]
windows = [
    "faster-whisper",
    "livekit>=1.1",      # AEC3 — wheel py3-none-win_amd64 confirmé sur PyPI (docs/30 §5.2, docs/34 §7)
    "soundcard",         # loopback WASAPI — sounddevice/PortAudio ne sait pas le faire (docs/34 §2)
]
# v1 Linux = mode distant seul (docs/49 L1) : pas de moteur local, donc pas de
# faster-whisper — l'embarquer gonflerait le .deb de ~100 Mo pour un moteur que
# `_linux()` ne construit jamais. À réintroduire avec le mode local (docs/49 §4.3).
linux = [
    "livekit>=1.1",      # AEC3 — nettoie la piste micro retenue même en mode distant (docs/48)
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "Pillow",            # génération de l'icône .ico Windows (scripts/generer_icone.py)
    "respx>=0.21",       # mock serveur HTTP pour les tests core/bluemind/ (sans réseau)
]
# Outil de benchmark (benchmark/) lancé en dev sur le Mac — cf. docs/08-benchmark.md.
# Le bundle portable embarque ces deps + faster-whisper/sherpa/pyannote (cf. assembler_bundle.py).
benchmark = [
    "psutil>=5.9",      # pics RAM/VRAM par étape
    "py-cpuinfo>=9.0",  # modèle CPU + cœurs physiques
]

[project.scripts]
debrief-meet = "debrief_meet.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_meet"]
artifacts = ["*.ttf", "*.svg"]   # polices IBM Plex + icônes Phosphor + illustrations assistant (ui/assets/)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=debrief_meet --cov=benchmark --cov-report=term-missing -p no:warnings"
markers = [
    "integration: tests nécessitant du vrai matériel ou des permissions système",
]

[tool.coverage.run]
source = ["src", "benchmark"]
omit = [
    "*/fakes*", "*/stubs*",
    # Outils de build/assets exécutés manuellement (validés en intégration / sur cible).
    "*/benchmark/assembler_bundle.py",
    "*/benchmark/assets/*",
]
