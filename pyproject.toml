[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debrief-meet"
version = "0.2.0"
description = "Transcription vocale locale — dictée, réunion, journal"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "numpy>=1.24",
    "sounddevice>=0.4",
    "scipy>=1.10",
]

[project.optional-dependencies]
macos = [
    "mlx-whisper",
    "livekit>=1.1",      # AEC3 (annulation d'écho sans casque) — APM WebRTC, cf. docs/06
    "pyannote.audio>=4,<5", # diarization passe finale (community-1, gated) — cf. docs/07 et docs/29 (API from_pretrained changée entre 3.x et 4.x)
]
windows = [
    "faster-whisper",
    "livekit>=1.1",      # AEC3 — wheel py3-none-win_amd64 confirmé sur PyPI (docs/30 §5.2, docs/34 §7)
]
linux = [
    "faster-whisper",
]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
]
# Outil de benchmark (benchmark/) lancé en dev sur le Mac — cf. docs/08-benchmark.md.
# Le bundle portable embarque ces deps + faster-whisper/sherpa/pyannote (cf. assembler_bundle.py).
benchmark = [
    "psutil>=5.9",      # pics RAM/VRAM par étape
    "py-cpuinfo>=9.0",  # modèle CPU + cœurs physiques
]

[project.scripts]
debrief-meet = "debrief_meet.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief_meet"]
artifacts = ["*.ttf", "*.svg"]   # fonte Tabler + illustrations assistant (ui/assets/)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=debrief_meet --cov=benchmark --cov-report=term-missing -p no:warnings"
markers = [
    "integration: tests nécessitant du vrai matériel ou des permissions système",
]

[tool.coverage.run]
source = ["src", "benchmark"]
omit = [
    "*/fakes*", "*/stubs*",
    # Outils de build/assets exécutés manuellement (validés en intégration / sur cible).
    "*/benchmark/assembler_bundle.py",
    "*/benchmark/assets/*",
]
