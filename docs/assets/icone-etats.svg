<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
  <title>debriefMeet — icône du tray et cycle de couleurs par état d'activité</title>
  <desc>La forme (carré arrondi + onde vocale) est constante ; la couleur encode l'état d'activité : repos (contour, template), enregistrement rouge, transcription orange, terminé vert bref, erreur grise brève.</desc>

  <defs>
    <!-- carré arrondi en contour (REPOS) -->
    <g id="hollow">
      <rect x="6" y="6" width="88" height="88" rx="22"
            fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>
      <g stroke="currentColor" stroke-width="7" stroke-linecap="round">
        <line x1="21" y1="38" x2="21" y2="62"/><line x1="35" y1="30" x2="35" y2="70"/>
        <line x1="50" y1="24" x2="50" y2="76"/><line x1="65" y1="32" x2="65" y2="68"/>
        <line x1="79" y1="36" x2="79" y2="64"/>
      </g>
    </g>
    <!-- carré arrondi plein (états actifs) -->
    <g id="filled">
      <rect x="6" y="6" width="88" height="88" rx="22" fill="currentColor"/>
      <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
        <line x1="21" y1="38" x2="21" y2="62"/><line x1="35" y1="30" x2="35" y2="70"/>
        <line x1="50" y1="24" x2="50" y2="76"/><line x1="65" y1="32" x2="65" y2="68"/>
        <line x1="79" y1="36" x2="79" y2="64"/>
      </g>
    </g>
  </defs>

  <rect x="0" y="0" width="820" height="560" fill="#ffffff"/>

  <text x="410" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1f">debriefMeet — icône du tray</text>
  <text x="410" y="62" text-anchor="middle" font-size="14" fill="#86868b">Forme constante (carré arrondi + onde vocale) — la couleur encode l'état d'activité, pas le mode</text>

  <!-- principe creux -> plein -->
  <g transform="translate(255,90)" color="#1d1d1f"><use href="#hollow" transform="scale(1.0)"/></g>
  <text x="392" y="155" font-size="26" fill="#c7c7cc">→</text>
  <g transform="translate(445,90)" color="#007AFF"><use href="#filled" transform="scale(1.0)"/></g>
  <text x="305" y="210" text-anchor="middle" font-size="12" fill="#86868b">contour (repos)</text>
  <text x="500" y="210" text-anchor="middle" font-size="12" fill="#86868b">plein (actif)</text>

  <!-- 5 états -->
  <g transform="translate(0,235)">
    <!-- REPOS -->
    <g transform="translate(20,0)">
      <rect x="0" y="0" width="150" height="150" rx="16" fill="#f5f5f7"/>
      <g transform="translate(35,16)" color="#1d1d1f"><use href="#hollow" transform="scale(0.85)"/></g>
      <text x="75" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">REPOS</text>
      <text x="75" y="132" text-anchor="middle" font-size="10.5" fill="#86868b">template (s'adapte)</text>
    </g>
    <!-- ENREGISTREMENT -->
    <g transform="translate(180,0)">
      <rect x="0" y="0" width="150" height="150" rx="16" fill="#fff5f5"/>
      <g transform="translate(35,16)" color="#FF3B30"><use href="#filled" transform="scale(0.85)"/></g>
      <text x="75" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#FF3B30">ENREGISTREMENT</text>
      <text x="75" y="132" text-anchor="middle" font-size="10.5" fill="#86868b">🔴 #FF3B30</text>
    </g>
    <!-- TRANSCRIPTION -->
    <g transform="translate(340,0)">
      <rect x="0" y="0" width="150" height="150" rx="16" fill="#fff8f0"/>
      <g transform="translate(35,16)" color="#FF9500"><use href="#filled" transform="scale(0.85)"/></g>
      <text x="75" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#FF9500">TRANSCRIPTION</text>
      <text x="75" y="132" text-anchor="middle" font-size="10.5" fill="#86868b">🟠 #FF9500</text>
    </g>
    <!-- TERMINE -->
    <g transform="translate(500,0)">
      <rect x="0" y="0" width="150" height="150" rx="16" fill="#f0fbf3"/>
      <g transform="translate(35,16)" color="#34C759"><use href="#filled" transform="scale(0.85)"/></g>
      <text x="75" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#34C759">TERMINÉ</text>
      <text x="75" y="132" text-anchor="middle" font-size="10.5" fill="#86868b">🟢 #34C759 · bref</text>
    </g>
    <!-- ERREUR -->
    <g transform="translate(660,0)">
      <rect x="0" y="0" width="150" height="150" rx="16" fill="#f5f5f7"/>
      <g transform="translate(35,16)" color="#8E8E93"><use href="#filled" transform="scale(0.85)"/></g>
      <text x="75" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#8E8E93">ERREUR</text>
      <text x="75" y="132" text-anchor="middle" font-size="10.5" fill="#86868b">⚪ #8E8E93 · bref</text>
    </g>
  </g>

  <!-- flèche de cycle -->
  <path d="M95 395 V420 H735 V395" fill="none" stroke="#c7c7cc" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="410" y="438" text-anchor="middle" font-size="12" fill="#86868b">cycle : REPOS → ENREGISTREMENT → TRANSCRIPTION → TERMINÉ (bref) → REPOS  ·  erreur → ERREUR (bref) → REPOS</text>

  <!-- notes -->
  <rect x="20" y="460" width="780" height="80" rx="14" fill="#f5f5f7"/>
  <text x="40" y="486" font-size="12.5" fill="#515154">• <tspan font-weight="600">Dictée / Journal</tspan> : repos → 🔴 enregistrement → 🟠 transcription (à l'arrêt) → 🟢 terminé → repos.</text>
  <text x="40" y="508" font-size="12.5" fill="#515154">• <tspan font-weight="600">Réunion</tspan> : 🔴 rouge en continu toute la session (transcription par tranches sans changement de couleur), 🟢 terminé bref à l'arrêt.</text>
  <text x="40" y="530" font-size="12.5" fill="#86868b">REPOS = monochrome template (QIcon.setIsMask) ; icône d'app (Dock) = carré bleu + ondes blanches, cf. AppIcon.icns.</text>
</svg>
