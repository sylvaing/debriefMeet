# TEMPORAIRE — diagnostic du segfault de tests/test_surveillant.py dans le conteneur
# ubuntu:26.04 (run 2 de build.yml, docs/52 §9). À supprimer une fois la cause connue.
name: Diag Linux (temporaire)

on:
  push:
    branches: ["claude/sleepy-neumann-8d6867"]
    paths: [".github/workflows/diag.yml"]

permissions:
  contents: read

jobs:
  diag:
    name: test_surveillant — PySide6 ${{ matrix.pyside }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pyside: ["6.12.0", "6.11.1"]
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
      PIP_CACHE_DIR: /root/.cache/pip
    steps:
      - name: Paquets système
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            git ca-certificates binutils \
            ffmpeg pulseaudio-utils \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libportaudio2 \
            python3 python3-venv python3-dev
      - uses: actions/checkout@v4
      - name: Venv + PySide6 épinglé
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv .venv
          ./.venv/bin/pip install -q --upgrade pip
          ./.venv/bin/pip install -q -e '.[linux,dev]' "PySide6==${{ matrix.pyside }}"
          ./.venv/bin/python -c "import PySide6, sys; print('PySide6', PySide6.__version__, 'Python', sys.version.split()[0])"
      - name: Libs manquantes du plugin multimédia (ldd)
        run: |
          for so in .venv/lib/python3*/site-packages/PySide6/Qt/plugins/multimedia/*.so .venv/lib/python3*/site-packages/PySide6/Qt/lib/libQt6Multimedia.so.6; do
            echo "== $so"; ldd "$so" | grep -E "not found" || echo "   (rien de manquant)"
          done
      - name: QMediaDevices seul
        continue-on-error: true
        run: |
          QT_LOGGING_RULES="qt.multimedia.*=true" ./.venv/bin/python -X faulthandler -c "
          from PySide6.QtCore import QCoreApplication
          from PySide6.QtMultimedia import QMediaDevices
          app = QCoreApplication([])
          print('entrées audio :', [d.description() for d in QMediaDevices.audioInputs()])
          "
      - name: pytest tests/test_surveillant.py
        run: |
          ./.venv/bin/python -X faulthandler -m pytest tests/test_surveillant.py -q --no-cov -p no:cacheprovider
