# Builds Windows (.exe) et Linux (.deb) sur GitHub Actions — docs/52.
#
# Deux déclencheurs :
#   - push d'un tag v* : build des deux cibles + Release GitHub portant les binaires ;
#   - workflow_dispatch : build des deux cibles, binaires dans les artefacts du run
#     (`gh workflow run build.yml`, cf. docs/52 §3).
#
# Les jobs windows/linux/macos rejouent les scripts natifs des machines de build
# (packaging/windows/build_app.cmd, packaging/linux/build_app.sh, `make dmg`) SANS
# les modifier dans leur logique : mêmes gates pytest bloquantes, mêmes exclusions.
# Le DMG macOS se construit aussi en local (`make dmg`, docs/16) ; en CI il n'est
# produit que sur un tag, ou à la demande (minutes macOS facturées ×10).
name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Construire aussi le DMG macOS (minutes facturées ×10)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Suite de tests sans matériel ni session graphique — sur les 3 OS (CLAUDE.md § Tests).
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  # Un crash natif (Qt, PortAudio) dans la gate pytest imprime la pile Python au lieu
  # d'un « Segmentation fault » nu — c'est ce qui a identifié QMediaDevices (docs/52 §9).
  PYTHONFAULTHANDLER: "1"

jobs:
  # ── 0. Garde-fou tag ↔ version ────────────────────────────────────────────────
  # Placé EN AMONT des builds (et non dans le job release) pour échouer en quelques
  # secondes plutôt qu'après 30 min de build Windows facturées ×2. Sur un
  # workflow_dispatch, le job ne fait que lire la version (aucun tag à comparer).
  version:
    name: Version et tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lire.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Lire __version__ et comparer au tag
        id: lire
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          init="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/debrief_meet/__init__.py)"
          pyproj="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          echo "src/debrief_meet/__init__.py : __version__ = $init"
          echo "pyproject.toml               : version     = $pyproj"
          if [ -z "$init" ] || [ "$init" != "$pyproj" ]; then
            echo "::error::__version__ ($init) et pyproject.toml ($pyproj) divergent — aligner les deux avant de tagger"
            exit 1
          fi
          # `vX.Y.Z` ⇔ __version__ "X.Y.Z" ; `vX.Y.Z-rcN` ⇔ "X.Y.ZrcN". Une rc produit
          # une PRERELEASE (job release), ignorée par `releases/latest`, et porte son
          # propre numéro : sinon elle se présente comme la finale et la mise à jour
          # automatique ne la remplace jamais (v0.4.0-rc1, 2026-10-23 — docs/53 §6).
          if [ "$REF_TYPE" = "tag" ]; then
            python3 packaging/verifier_tag_version.py "$init" "$REF_NAME"
          fi
          echo "version=$init" >> "$GITHUB_OUTPUT"

  # ── 1. Setup Windows ──────────────────────────────────────────────────────────
  windows:
    name: Setup Windows (.exe)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Python 3.13 obligatoire (PyInstaller ≠ 3.14 sur cette chaîne, CLAUDE.md
      # § Environnements Python). Le cache pip est celui de l'utilisateur du runner :
      # le venv .venv-build créé par build_app.cmd en profite aussi.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # L'image windows-latest embarque déjà Inno Setup 6 ; choco n'intervient que
      # s'il manque. build_app.cmd [6/6] le trouve dans Program Files (x86) sans
      # qu'on ait à définir ISCC_EXE.
      - name: Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable après installation" }
          Write-Host "ISCC : $iscc"

      # Le zip BtbN (~100 Mo) est épinglé par URL + SHA256 dans telecharger_ffmpeg.cmd :
      # la clé de cache dérive du script, donc un changement de version ffmpeg
      # invalide le cache tout seul. Le script vérifie le SHA256 à chaque build,
      # cache restauré ou non.
      - name: Cache du zip ffmpeg (BtbN)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\ffmpeg-cache\ffmpeg-win64-lgpl.zip
          key: ffmpeg-btbn-${{ hashFiles('packaging/windows/telecharger_ffmpeg.cmd') }}

      # BtbN purge ses autobuilds datés (404 constaté au premier run, docs/52 §9) et
      # GitHub évince un cache inutilisé 7 jours : sans miroir, tout build après une
      # pause échouerait. Le zip épinglé est donc aussi un asset de la release
      # `outils-build` de CE dépôt ; on le dépose dans le cache, le script vérifie
      # son SHA256 comme d'habitude. continue-on-error : si le miroir manque (fork,
      # asset pas encore mis à jour après un ré-épinglage), le script retombe sur
      # l'URL BtbN — et échoue proprement si elle a été purgée.
      - name: Zip ffmpeg depuis le miroir du dépôt (si cache absent)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "$env:RUNNER_TEMP\ffmpeg-cache"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download outils-build --repo $env:GITHUB_REPOSITORY --pattern ffmpeg-win64-lgpl.zip --dir $dir --clobber
          Get-ChildItem $dir

      # Même format que scripts/build_app_windows_vm.sh [1/4] : date UTC puis hash
      # git court → VERSION_COMPLETE = "<__version__>+<AAAAMMJJ>.<hash>".
      - name: BUILD_INFO (date UTC + hash git court)
        shell: bash
        run: |
          date -u +%Y%m%d > BUILD_INFO
          git rev-parse --short HEAD >> BUILD_INFO
          cat BUILD_INFO

      # venv + pip install + ffmpeg + generer_version + pytest BLOQUANT + PyInstaller
      # + Inno Setup — le script natif de la VM, pointé sur le workspace du runner.
      - name: build_app.cmd
        shell: cmd
        env:
          BUILD_DIR: ${{ github.workspace }}
          PYTHON_EXE: python
          FFMPEG_CACHE_DIR: ${{ runner.temp }}\ffmpeg-cache
        run: packaging\windows\build_app.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: debriefMeet-setup-windows
          path: dist/debriefMeet-setup-*.exe
          if-no-files-found: error
          retention-days: 30

  # ── 2. Paquet .deb Linux ──────────────────────────────────────────────────────
  # Conteneur ubuntu:26.04 (image Docker Hub vérifiée le 2026-10-20) : c'est la
  # cible du .deb (docs/49) ET son Python système 3.14 (décision L7) — un
  # ubuntu-latest nu aurait le mauvais Python et des libs système plus anciennes
  # que celles contre lesquelles PyInstaller lie le bundle.
  linux:
    name: Paquet .deb (Ubuntu 26.04)
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      # HOME=/github/home appartient à l'uid du runner, pas à root : pip y DÉSACTIVE
      # son cache (« not owned by the current user », constaté au run 2).
      PIP_CACHE_DIR: /root/.cache/pip
    steps:
      # Miroir de scripts/provisionner_lxc_ubuntu.sh [2/5] + [3/5] (mêmes paquets,
      # mêmes raisons — voir les commentaires de ce script), + git/ca-certificates
      # pour actions/checkout et le hash git de BUILD_INFO.
      - name: Paquets système (miroir de provisionner_lxc_ubuntu.sh)
        run: |
          apt-get update -qq
          apt-get install -y -qq \
            git ca-certificates rsync binutils dpkg-dev fakeroot \
            ffmpeg pulseaudio-utils \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libportaudio2 \
            python3 python3-venv python3-dev
          echo "python : $(python3 --version)"
          echo "ffmpeg : $(ffmpeg -version | head -1)"

      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: /root/.cache/pip
          key: pip-ubuntu2604-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-ubuntu2604-

      # safe.directory : le workspace est monté dans le conteneur avec l'uid du runner
      # (1001) alors que les steps tournent en root — git 2.35+ refuse sinon
      # (« dubious ownership », constaté au premier run).
      - name: BUILD_INFO (date UTC + hash git court)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          date -u +%Y%m%d > BUILD_INFO
          git rev-parse --short HEAD >> BUILD_INFO
          cat BUILD_INFO

      # venv + pip install + generer_version + pytest BLOQUANT (segfault de teardown
      # Python 3.14/PySide6 toléré par le script lui-même) + PyInstaller + dpkg-deb.
      - name: build_app.sh
        run: sh packaging/linux/build_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debriefmeet-deb-linux
          path: dist/debriefmeet_*_amd64.deb
          if-no-files-found: error
          retention-days: 30

  # ── 3. DMG macOS ──────────────────────────────────────────────────────────────
  # Même commande qu'en local : `make dmg` (docs/16) — ffmpeg LGPL compilé (mis en
  # cache), helper Swift SCK, PyInstaller, signature, create-dmg. Runner Apple
  # Silicon obligatoire (mlx). Seulement sur tag ou à la demande : ×10 en minutes.
  macos:
    name: DMG macOS
    if: github.ref_type == 'tag' || inputs.macos
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Outils Homebrew (create-dmg, pkg-config)
        run: brew install --quiet create-dmg pkg-config

      # ffmpeg LGPL minimal compilé depuis les sources (opus + ffmpeg, ~10 min) :
      # mis en cache sur le hash du script, qui épingle versions et SHA256 ;
      # build_ffmpeg.sh est idempotent et REVALIDE le binaire restauré.
      - name: Cache du ffmpeg LGPL compilé
        uses: actions/cache@v4
        with:
          path: |
            packaging/vendor/ffmpeg
            packaging/vendor/LICENSE-ffmpeg.md
          key: ffmpeg-macos-${{ runner.arch }}-${{ hashFiles('packaging/build_ffmpeg.sh') }}

      # Identité « debriefMeet Local » : la MÊME qu'en local, pour que TCC conserve
      # Micro + Enregistrement de l'écran d'un build à l'autre (docs/16). Elle arrive
      # par deux secrets du dépôt (export .p12 du trousseau de Sylvain, docs/52 §6).
      # Sans secrets : refus sur un tag (un DMG de release à signature instable
      # ferait redemander les permissions à chaque version), identité ÉPHÉMÈRE
      # sinon (créée par creer_certificat.sh dans le trousseau temporaire) — bon pour
      # vérifier la chaîne, pas pour installer sur un poste.
      - name: Trousseau temporaire + identité de signature
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # Trousseau temporaire du job (supprimé en fin de job) : jamais le trousseau
          # de session du runner. creer_certificat.sh et build_app.sh le lisent via
          # DEBRIEFMEET_KEYCHAIN, exporté aux steps suivants.
          KC="$RUNNER_TEMP/debriefmeet-ci.keychain-db"
          # $GITHUB_ENV ne vaut que pour les steps SUIVANTS : l'export couvre
          # creer_certificat.sh appelé plus bas dans CE step (run 6 : l'identité
          # éphémère partait dans le trousseau de session, puis
          # set-key-partition-list ne la trouvait pas dans $KC).
          export DEBRIEFMEET_KEYCHAIN="$KC"
          echo "DEBRIEFMEET_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          KC_PWD="$(uuidgen)"
          security create-keychain -p "$KC_PWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PWD" "$KC"
          security list-keychains -d user -s "$KC" "$HOME/Library/Keychains/login.keychain-db"
          if [ -n "$CERT_P12_BASE64" ]; then
            echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "identité stable importée depuis les secrets"
          elif [ "$REF_TYPE" = "tag" ]; then
            echo "::error::secrets MACOS_CERT_P12_BASE64 / MACOS_CERT_P12_PASSWORD absents — un DMG de release doit porter l'identité stable (docs/52 §6)"
            exit 1
          else
            echo "::warning::aucun secret de certificat — identité ÉPHÉMÈRE : ce DMG fera redemander les permissions TCC, ne pas le diffuser"
            bash packaging/creer_certificat.sh
          fi
          # Autorise codesign sans boîte de dialogue (il n'y a personne pour cliquer
          # « Toujours autoriser » sur un runner).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PWD" "$KC" >/dev/null
          security find-identity -p codesigning "$KC" | grep "debriefMeet Local"

      # Venv de build attendu par build_app.sh (docs/16 §2) : Python 3.13 + extras
      # macOS (mlx-whisper, livekit, pyannote) + dev pour la gate.
      - name: Venv de build (.venv-build)
        run: |
          python -m venv .venv-build
          ./.venv-build/bin/pip install --quiet --upgrade pip
          ./.venv-build/bin/pip install --quiet -e '.[macos,dev]' pyinstaller
          ./.venv-build/bin/python --version

      # ffmpeg avant la gate : tests/test_build.py interroge le binaire RÉELLEMENT
      # livré (muxer segment, filtres, limite d'imbrication — docs/42 §10.4-10.6, les
      # trois régressions invisibles à `make test`). PortAudio 19.7.0 + #1175 pour la
      # même raison : le test vérifie que la dylib embarquée est la version corrigée
      # (docs/16 §5.7). Helper Swift compilé en ad hoc pour le même test (build_app.sh
      # le recompile ensuite, signé).
      - name: ffmpeg LGPL + PortAudio corrigé + helper Swift (pour la gate)
        run: |
          bash packaging/build_ffmpeg.sh
          bash packaging/build_portaudio.sh
          bash helpers/macos/sck-audio/build.sh

      # Gate bloquante, mêmes exclusions que Windows/Linux, SAUF test_build.py qui
      # tourne ici (c'est le dépôt Mac qu'il teste) moins l'audio canonique du
      # benchmark, absent d'un clone (docs/08).
      # RC=139 toléré UNIQUEMENT si le résumé pytest rapporte des tests passés et aucun
      # échec : segfault connu au teardown de pytest, APRÈS le rapport (PySide6 /
      # Python 3.13-3.14, cf. CLAUDE.md et packaging/linux/build_app.sh qui applique
      # la même règle). Run 7 : 1608 passed puis exit 139 — le build était bon.
      - name: Suite de tests (bloquant)
        run: |
          set +e
          TESTS_OUT="$(mktemp)"
          ./.venv-build/bin/python -m pytest -m "not integration" -q --no-cov \
            --ignore-glob='tests/test_benchmark_*.py' \
            --ignore-glob='tests/test_spike_backends_*.py' \
            --deselect tests/test_build.py::TestBenchmarkBundle::test_audio_canonique_present \
            2>&1 | tee "$TESTS_OUT"
          RC=${PIPESTATUS[0]}
          if [ "$RC" -ne 0 ]; then
            if [ "$RC" -eq 139 ] && grep -qE '[0-9]+ passed' "$TESTS_OUT" \
                && ! grep -qE '[0-9]+ failed' "$TESTS_OUT"; then
              echo "::warning::pytest RC=139 (segfault connu au teardown) — tous les tests ont réussi, build non bloqué."
            else
              exit "$RC"
            fi
          fi

      - name: make dmg
        run: make dmg

      - name: Signature du bundle produit
        run: codesign -dv --verbose=4 dist/debriefMeet.app 2>&1 | grep -E "Authority|Identifier"

      # Le zip de mise à jour (docs/53) doit se dézipper en un bundle dont le sceau est
      # intact et signé par la même identité — c'est ce que vérifie le script de
      # remplacement sur le poste avant d'échanger les bundles.
      - name: Aller-retour du zip de mise à jour (ditto -x -k + codesign --verify)
        run: |
          set -euo pipefail
          d="$(mktemp -d)"
          ditto -x -k dist/debriefMeet-*.zip "$d"
          codesign --verify --deep --strict "$d/debriefMeet.app"
          # --verbose=4 : sans lui `codesign -dv` ne liste pas les Authority (1er run CI
          # de docs/53 rouge pour ça) ; pas de `grep -q` sous pipefail (SIGPIPE).
          codesign -dv --verbose=4 "$d/debriefMeet.app" 2>&1 | grep "Authority=debriefMeet Local"

      - uses: actions/upload-artifact@v4
        with:
          name: debriefMeet-dmg-macos
          path: |
            dist/debriefMeet-*.dmg
            dist/debriefMeet-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Suppression du trousseau temporaire
        if: always()
        run: security delete-keychain "$DEBRIEFMEET_KEYCHAIN" || true

  # ── 4. Manifeste de mise à jour (docs/53) — dispatch seulement ─────────────────
  # Rejoue hors tag tout ce que fait le job release sauf l'upload : renommage des
  # assets, génération + signature + VÉRIFICATION du manifeste avec la clé publique
  # embarquée dans l'app. Résultat en artefact, pour tester une mise à jour de bout
  # en bout sans publier (DEBRIEFMEET_MAJ_URL sur un serveur local).
  manifeste:
    name: Manifeste de mise à jour (dispatch)
    if: github.event_name == 'workflow_dispatch'
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet cryptography
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true
      - name: Renommage, manifeste, signature, vérification
        env:
          MAJ_CLE_PRIVEE_PEM: ${{ secrets.MAJ_CLE_PRIVEE_PEM }}
        run: bash packaging/publier_manifeste.sh "$VERSION" "v$VERSION-dispatch" "$GITHUB_REPOSITORY" artefacts
      - uses: actions/upload-artifact@v4
        with:
          name: debriefMeet-manifeste
          path: |
            artefacts/manifest.json
            artefacts/manifest.sig
          if-no-files-found: error
          retention-days: 30

  # ── 5. Release GitHub (tags seulement) ────────────────────────────────────────
  release:
    name: Release GitHub
    if: github.ref_type == 'tag'
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # checkout : packaging/publier_manifeste.sh + generer_manifeste.py + le module
      # core/mise_a_jour.py de l'app (sa clé publique embarquée juge la signature).
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --quiet cryptography

      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      # Noms publics SANS `+<date>.<hash>` (l'app ne peut pas deviner le hash, et `+`
      # dans un nom d'asset n'est pas documenté par GitHub) ; VERSION_COMPLETE reste à
      # l'intérieur des binaires. Puis manifest.json signé par le secret et VÉRIFIÉ
      # avec la clé publique embarquée : un secret qui ne correspond pas casse la
      # release ici, jamais les postes. Secret absent ⇒ échec explicite.
      - name: Renommage des assets, manifeste signé et vérifié
        env:
          MAJ_CLE_PRIVEE_PEM: ${{ secrets.MAJ_CLE_PRIVEE_PEM }}
        run: bash packaging/publier_manifeste.sh "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" artefacts

      - name: Binaires à publier
        run: ls -l artefacts

      # Noms EXACTS (plus de globs) : fail_on_unmatched_files refuse une release
      # incomplète. manifest.* en DERNIER : les uploads suivent cet ordre, un poste qui
      # lit latest/download/manifest.json pendant la publication ne peut pas tomber
      # sur un manifeste dont les binaires ne sont pas encore en ligne.
      - uses: softprops/action-gh-release@v2
        with:
          name: debriefMeet ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            artefacts/debriefMeet-setup-${{ needs.version.outputs.version }}.exe
            artefacts/debriefmeet_${{ needs.version.outputs.version }}_amd64.deb
            artefacts/debriefMeet-${{ needs.version.outputs.version }}.dmg
            artefacts/debriefMeet-${{ needs.version.outputs.version }}.zip
            artefacts/manifest.json
            artefacts/manifest.sig
          fail_on_unmatched_files: true
          body: |
            debriefMeet ${{ needs.version.outputs.version }} — commit `${{ github.sha }}`.

            - **Windows** : `debriefMeet-setup-<version>.exe` (installeur Inno Setup, un seul build — mode distant/local au choix dans les Préférences).
            - **Linux (Ubuntu 26.04, amd64)** : `debriefmeet_<version>_amd64.deb` (`sudo apt install ./debriefmeet_*.deb`).
            - **macOS (Apple Silicon)** : `debriefMeet-<version>.dmg` (glisser dans Applications ; signature locale stable, pas de notarisation : clic droit › Ouvrir au premier lancement). Le `.zip` sert à la mise à jour automatique.

            Mise à jour automatique depuis 0.4.0 : l'application vérifie `manifest.json` (signé) une fois par jour et propose d'installer la nouvelle version (Windows et macOS) ; sur Linux, réinstaller le `.deb`.
